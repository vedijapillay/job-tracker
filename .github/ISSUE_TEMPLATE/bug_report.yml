name: Bug report
description: Something in Job Tracker is not working
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping. If the problem is a **missed or wrongly labelled email**, please use the "Missed or wrong email" form instead.

        If you think you've found a **security problem**, don't post it here. Use the private report link on the issue chooser page, or see SECURITY.md.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run npm start
        2. Click ...
        3. See ...
    validations:
      required: false

  - type: dropdown
    id: how-running
    attributes:
      label: How are you running it?
      options:
        - npm start (the real app)
        - npm run demo
        - npm run dev / npm run dev:client (development)
        - Other
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Operating system and Node.js version
      description: Run `node -v` to get the version.
      placeholder: "macOS 15, Node v22.5.0"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error messages or logs (optional)
      description: Paste anything that appears in the terminal or the browser console. **Remove tokens, passwords, your Google client secret and any email content first.**
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have removed secrets and personal information from everything above.
          required: true
