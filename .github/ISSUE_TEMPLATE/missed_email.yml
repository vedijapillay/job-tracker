name: Missed or wrong email
description: The Gmail scan missed an email, or got its status, company or job title wrong
title: "[Email] "
labels: ["bug", "classification"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Reports like this are how the scan gets better.

        **Please do not paste the email itself, and do not include names, addresses, links, phone numbers or anything personal.** The sender's domain and the subject line are almost always enough.

  - type: input
    id: sender
    attributes:
      label: Who sent it?
      description: The sender's domain (for example `greenhouse.io`) or the company's name. Not a personal email address.
      placeholder: greenhouse.io
    validations:
      required: true

  - type: input
    id: subject
    attributes:
      label: Subject line
      description: Copy it exactly, but remove any personal details.
      placeholder: "Update on your application to Acme"
    validations:
      required: true

  - type: dropdown
    id: problem
    attributes:
      label: What went wrong?
      options:
        - The scan did not find the email at all
        - It found it but chose the wrong status
        - It chose the wrong company
        - It chose the wrong job title
        - It showed an email that is not about a job
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What should it have shown?
      description: >-
        For example, "status Rejected, company Acme". Say what it showed instead if you can.
    validations:
      required: false

  - type: textarea
    id: phrase
    attributes:
      label: A short phrase from the email that gives it away (optional)
      description: >-
        One sentence at most, with anything personal removed, such as "we have decided to move forward with other candidates". This is the most useful thing you can share.
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have removed personal information from everything above.
          required: true
