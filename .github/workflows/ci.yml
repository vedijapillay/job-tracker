name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # npm ci installs exactly what the lockfiles say, and fails if they are out of date
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix client

      # The server test also checks that the built web app is served
      - name: Build the web app
        run: npm run build

      - name: Run tests
        run: npm test

  # The README's first command is `npm run setup`. npm hands its settings to the commands it
  # runs, so a user-level `allow-scripts` setting used to break it. CI has no such setting,
  # so this job supplies one to reproduce that situation.
  setup-script:
    name: npm run setup on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the setup command from the README
        run: npm run setup
        env:
          npm_config_allow_scripts: some-package

      - name: Check the web app was built
        run: node -e "require('fs').accessSync('client/dist/index.html'); console.log('client/dist/index.html exists')"
